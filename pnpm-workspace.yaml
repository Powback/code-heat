# [proj.pnpm.1.3] Minimal YAML file with single "packages" key listing glob patterns
# [proj.pnpm.1.4] No additional configuration (dependency resolution handled by pnpm defaults)

packages:
  # [proj.pnpm.1.1] Include all packages under packages/ directory
  - 'packages/*'
  # [proj.pnpm.1.2] Include sample app
  - 'sample-app'
